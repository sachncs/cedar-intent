[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cedrus"
dynamic = ["version"]
description = "Compile organizational authorization intent into validated Cedar policies."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Sachin", email = "sachncs@gmail.com" },
]
requires-python = ">=3.11"
keywords = ["cedar", "authorization", "policy", "policy-as-code", "iam"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Security :: Authorization",
    "Typing :: Typed",
]
dependencies = [
    "cedarpy>=4.8.7,<5",
    "httpx>=0.27,<1",
    "litellm>=1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-httpx>=0.30",
]

[project.urls]
Homepage = "https://github.com/sachin/cedrus"
Source = "https://github.com/sachin/cedrus"
Issues = "https://github.com/sachin/cedrus/issues"
Changelog = "https://github.com/sachin/cedrus/blob/main/CHANGELOG.md"
Security = "https://github.com/sachin/cedrus/blob/main/SECURITY.md"

[project.scripts]
cedrus = "cedrus.cli:main"

[tool.setuptools]
packages = [
    "cedrus",
    "cedrus.policy",
    "cedrus.generate",
    "cedrus.store",
]

[tool.setuptools.package-data]
cedrus = ["py.typed"]

[tool.setuptools.dynamic]
version = {attr = "cedrus.__version__"}

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]

[tool.mypy]
files = ["cedrus"]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
module = ["cedarpy", "litellm"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require SQLite or external resources",
]
